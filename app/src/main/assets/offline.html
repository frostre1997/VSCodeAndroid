<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Code Studio - Offline</title>
    <style>
        :root {
            --accent: #007acc;
            --accent-hover: #1a8ad4;
            --navy: #0a1a2f;
            --text: #d4d4d4;
            --text-dim: #9aa0a6;
            --surface: rgba(255, 255, 255, 0.06);
            --surface-border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 600px at 85% -10%, rgba(0, 122, 204, 0.35), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(0, 122, 204, 0.25), transparent 55%),
                linear-gradient(135deg, #0a1a2f 0%, #12304f 55%, #0a1a2f 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            min-height: 100vh;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .card {
            max-width: 420px;
            width: 100%;
            padding: 40px 32px 32px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        .logo {
            width: 84px;
            height: 84px;
            margin: 0 auto 28px;
            display: block;
            animation: float 2.6s ease-in-out infinite;
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-7px); }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-dim);
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 13px 34px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.15s ease;
            box-shadow: 0 10px 24px rgba(0, 122, 204, 0.35);
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: rgba(212, 212, 212, 0.45);
        }

        @media (max-width: 480px) {
            .card { padding: 32px 24px 26px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 100 100" fill="none">
                <path d="M32 30 L19 50 L32 70" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M68 30 L81 50 L68 70" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M75 28 L40 72" stroke="#7fd1ff" stroke-width="4.6" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>Connect to the internet and retry to get back to your code.</p>
        <button class="btn" onclick="if (window.gonative && gonative.webview) { gonative.webview.reload(); } else { location.reload(); }">Retry</button>
        <div class="footer">Visual Code Studio</div>
    </div>
</body>
</html>
